name: CMake

on:
  push:
    branches: [ master, actions ]
  pull_request:
    branches: [ master ]

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Debug

permissions:
  id-token: write
  contents: read    # This is required for actions/checkout@v2

jobs:
  build_centos7:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Build & test in CentOS 7
        uses: docker://kreisl/rootcpp17
        with:
          entrypoint: /bin/bash
          args: -lc "
            source /opt/rh/devtoolset-8/enable &&
            cmake -B build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DAnalysisTreeQA_BUILD_TESTS=ON -DAnalysisTreeQA_BUNDLED_AT=ON . &&
            cmake --build build &&
            cd build && ctest -C ${{env.BUILD_TYPE}}"
        
  build_fedora35:
    container: rootproject/root:6.24.06-fedora35
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v2
    - name: Configure CMake
      run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DAnalysisTreeQA_BUILD_TESTS=ON -DAnalysisTreeQA_BUNDLED_AT=ON
    - name: Build
      run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}
    - name: Test
      run: cd ${{github.workspace}}/build && ctest -C ${{env.BUILD_TYPE}}

  build_fedora34:
    container: rootproject/root:6.22.08-fedora34
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Configure CMake
        run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DAnalysisTreeQA_BUILD_TESTS=ON -DAnalysisTreeQA_BUNDLED_AT=ON
      - name: Build
        run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}
      - name: Test
        run: cd ${{github.workspace}}/build && ctest -C ${{env.BUILD_TYPE}}

  # Builds the optional CLI + YAML task framework (services/). Kept as its
  # own job, separate from build_fedora35/34/build_centos7 above, since
  # AnalysisTreeQA_BUILD_SERVICES=ON is the only configuration that needs
  # yaml-cpp and Boost::program_options - the default build (used by every
  # other job) must keep working without either.
  build_services_fedora35:
    container: rootproject/root:6.24.06-fedora35
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - name: Install yaml-cpp and Boost
        run: dnf install -y yaml-cpp-devel boost-devel
      - name: Configure CMake
        run: cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} -DAnalysisTreeQA_BUNDLED_AT=ON -DAnalysisTreeQA_BUILD_SERVICES=ON -DAnalysisTreeQA_BUILD_TASKS=ON
      - name: Build
        run: cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}}

